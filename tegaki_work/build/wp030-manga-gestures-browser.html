<!doctype html><html lang="ja"><meta charset="utf-8"><title>WP030 複数しっぽ・コマ操作</title>
<style>body{background:#ffffee;color:#800000;font:12px system-ui}iframe{width:1280px;height:720px;border:1px solid #b8706b}pre{white-space:pre-wrap}</style>
<button id="run" disabled>しっぽとコマを検証</button><button id="inspect" disabled>コマ編集を表示</button><span id="state">製品起動中</span><pre id="output"></pre><iframe id="product" src="../index.html"></iframe>
<script type="module">
import { buildPresetById, findNode, resolvePanelLayout } from '../system/panel-layout.js';
const frame=document.querySelector('#product'),out=document.querySelector('#output'),state=document.querySelector('#state');
const delay=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
let core;for(let i=0;i<200;i++){core=frame.contentWindow?.coreEngine;if(core?.popupManager?.get('panelLayout')?.isReady())break;await delay(100);}
const win=frame.contentWindow,balloon=core.popupManager.get('balloon'),panel=core.popupManager.get('panelLayout'),q=(p,s)=>p.popup.querySelector(s),realm=v=>win.JSON.parse(JSON.stringify(v));

const panelStroke=async(start,end,mods={})=>{panel.overlay.render();const body=panel.resolved.panels[0],h=panel.overlay.svg.querySelector(`[data-panel-id="${body.id}"]`),center=panel.overlay._toScreen({x:body.quad.reduce((s,p)=>s+p.x/4,0),y:body.quad.reduce((s,p)=>s+p.y/4,0)});check(win.document.elementFromPoint(center.x,center.y)===h,'分割modeの本体内側が実入力を受ける');await worldEvents(panel,h,start,end,mods);};
state.textContent='検証可能';document.querySelectorAll('button').forEach(b=>b.disabled=false);
document.querySelector('#inspect').onclick=()=>{frame.style.width='1280px';frame.style.height='720px';win.dispatchEvent(new win.Event('resize'));core.popupManager.show('panelLayout');panel.tree=buildPresetById('grid4');panel.selectedId=panel.tree.a.a.id;panel._changed();};
document.querySelector('#run').onclick=async()=>{
 const original=structuredClone(balloon.params),originalPanel={tree:structuredClone(panel.tree),params:structuredClone(panel.params),outputMode:panel.outputMode},prefs=['tegaki-balloon-v1','tegaki-panel-layout-v1'].map(k=>[k,win.localStorage.getItem(k)]);state.textContent='実行中';out.textContent='';
 try{
  core.popupManager.show('balloon');balloon._onAction('reset');balloon._setParams({...balloon.params,text:{...balloon.params.text,content:''}});q(balloon,'[data-context="tail"]').click();const primary=JSON.stringify(balloon.params.tail);q(balloon,'[data-action="tail-add"]').click();check(balloon.params.extraTails.length===1&&balloon.tailIndex===1,'しっぽ②追加・対象選択');q(balloon,'[data-tail-style="thought"]').click();check(balloon.params.extraTails[0].style==='thought'&&JSON.stringify(balloon.params.tail)===primary,'②を考え事の丸に・①保持');

  const before=structuredClone(balloon.params.extraTails[0].tip),r=balloon.params.rect;await worldEvents(balloon,balloon.overlay.svg.querySelector('[data-kind="center"]'),{x:r.x+r.w/2,y:r.y+r.h/2},{x:r.x+r.w/2+5,y:r.y+r.h/2+6});check(balloon.params.extraTails[0].tip.x===before.x+5&&balloon.params.extraTails[0].tip.y===before.y+6,'本体移動で追加先端追従');
  q(balloon,'[data-action="tail-add"]').click();q(balloon,'[data-action="tail-add"]').click();check(balloon.params.extraTails.length===3&&q(balloon,'[data-action="tail-add"]').disabled,'4本上限・GUI追加停止');q(balloon,'[data-action="tail-remove"]').click();check(balloon.params.extraTails.length===2,'選択extraを削除');
  const added=await balloon.apply(),recipe=structuredClone(balloon.params);check(added.ok,'複数しっぽRaster確定');balloon.hide();let beforePixels=pixels(),project=await core.projectManager.exportProject();await core.projectManager.loadProject(realm(project));let layer=core.layerSystem.getLayers().find(l=>l.layerData.id===added.layerId);core.layerSystem.setActiveLayer(core.layerSystem.getLayerIndex(layer));check(JSON.stringify(layer.layerData.balloon.params)===JSON.stringify(recipe)&&JSON.stringify(pixels())===JSON.stringify(beforePixels),'複数しっぽProject・PNG一致');
  core.popupManager.show('balloon');balloon.loadFromActiveLayer();balloon.tailIndex=1;balloon._syncControls();q(balloon,'[data-action="tail-remove"]').click();await balloon.update();core.history.undo();check(core.layerSystem.getActiveLayer().layerData.balloon.params.extraTails.length===2,'追加しっぽ削除の更新Undo');core.history.redo();
  core.popupManager.show('panelLayout');panel.tree=buildPresetById('single');panel.selectedId=null;panel._changed();q(panel,'[data-panel-tool="cut"]').click();let quad=panel.resolved.panels[0].quad;await panelStroke({x:quad[0].x+8,y:160},{x:quad[1].x-8,y:180});check(panel.resolved.panels.length===2&&panel.tree.slant!==0,'Canvas斜線ドラッグで既存分割木を生成');
  const saved=JSON.stringify(panel.tree);quad=panel.resolved.panels[0].quad;await panelStroke({x:quad[0].x+10,y:quad[0].y+10},{x:quad[0].x+11,y:quad[0].y+11});check(JSON.stringify(panel.tree)===saved,'短いドラッグを拒否・木不変');
  quad=panel.resolved.panels[0].quad;await panelStroke({x:quad[0].x+15,y:70},{x:quad[1].x-15,y:90},{shiftKey:true});const horizontalCut=panel.resolved.splits.find(s=>s.id===panel.tree.a.id)?.cut;check(panel.resolved.panels.length===3&&horizontalCut&&Math.abs(horizontalCut[0].y-horizontalCut[1].y)<.001,'Shiftで水平に分割（傾いたコマ内もworld水平）');
  q(panel,'[data-panel-tool="select"]').click();panel.selectedId=panel.resolved.panels[0].id;panel._syncControls();panel.overlay.render();let hit=panel.overlay.svg.querySelector(`[data-panel-id="${panel.selectedId}"]`),parent=panel._selectedParentSplit(),ratio=parent.ratio,cam=core.cameraSystem.worldContainer.scale.x;
  check(win.getComputedStyle(hit).pointerEvents==='stroke','通常連動コマ内側は描画へ透過');win.document.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'ControlLeft',key:'Control',ctrlKey:true,bubbles:true}));check(win.getComputedStyle(hit).pointerEvents==='all','Ctrl対象操作中は本体内側が操作面');win.document.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'ControlLeft',key:'Control',bubbles:true}));check(win.getComputedStyle(hit).pointerEvents==='stroke','Ctrl解除で描画へ戻る');
  hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:100,ctrlKey:true,bubbles:true,cancelable:true}));check(panel._selectedParentSplit().ratio!==ratio&&core.cameraSystem.worldContainer.scale.x===cam,'Ctrl+wheelは連動境界・Camera不変');
  panel.overlay.render();hit=panel.overlay.svg.querySelector(`[data-panel-id="${panel.selectedId}"]`);parent=panel._selectedParentSplit();const slant=parent.slant;hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:100,ctrlKey:true,shiftKey:true,bubbles:true,cancelable:true}));check(panel._selectedParentSplit().slant!==slant,'Ctrl+Shift+wheelで境界傾き');
  quad=panel.resolved.panels[0].quad;let center={x:quad.reduce((s,p)=>s+p.x/4,0),y:quad.reduce((s,p)=>s+p.y/4,0)},beforeRatio=panel._selectedParentSplit().ratio;panel.overlay.render();await worldEvents(panel,panel.overlay.svg.querySelector(`[data-panel-id="${panel.selectedId}"]`),center,{x:center.x,y:center.y+14},{ctrlKey:true});check(panel._selectedParentSplit().ratio!==beforeRatio&&!findNode(panel.tree,panel.selectedId).free,'Ctrl+dragは連動維持・境界移動');
  q(panel,'[data-action="toggle-free"]').click();const freeId=panel.selectedId,oldQuad=JSON.stringify(findNode(panel.tree,freeId).quad);panel.overlay.render();hit=panel.overlay.svg.querySelector(`[data-panel-id="${freeId}"]`);hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:-100,ctrlKey:true,bubbles:true,cancelable:true}));check(JSON.stringify(findNode(panel.tree,freeId).quad)!==oldQuad,'フリーコマCtrl+wheelで拡縮');
  const scaled=JSON.stringify(findNode(panel.tree,freeId).quad);panel.overlay.render();hit=panel.overlay.svg.querySelector(`[data-panel-id="${freeId}"]`);hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:100,ctrlKey:true,shiftKey:true,bubbles:true,cancelable:true}));check(JSON.stringify(findNode(panel.tree,freeId).quad)!==scaled,'フリーコマCtrl+Shift+wheelで回転');
  win.document.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));check(win.getComputedStyle(hit).pointerEvents==='none','コマhit上もSpaceでCameraへ譲る');win.document.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'Space',key:' ',bubbles:true}));
  const treeBefore=JSON.stringify(panel.tree),cameraBefore=core.cameraSystem.worldContainer.scale.x;hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));check(core.cameraSystem.worldContainer.scale.x!==cameraBefore&&JSON.stringify(panel.tree)===treeBefore,'通常wheelはCamera zoom・コマ不変');
  const renderer=win.document.querySelector('.canvas-area canvas'),camera=core.cameraSystem;
  win.document.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true}));
  const position={x:camera.worldContainer.x,y:camera.worldContainer.y},canvasRect=renderer.getBoundingClientRect(),start={x:canvasRect.left+canvasRect.width*.6,y:canvasRect.top+canvasRect.height*.5};
  renderer.dispatchEvent(new win.PointerEvent('pointerdown',{pointerId:67,pointerType:'mouse',button:0,buttons:1,clientX:start.x,clientY:start.y,bubbles:true}));renderer.dispatchEvent(new win.PointerEvent('pointermove',{pointerId:67,pointerType:'mouse',buttons:1,clientX:start.x+18,clientY:start.y+13,bubbles:true}));renderer.dispatchEvent(new win.PointerEvent('pointerup',{pointerId:67,pointerType:'mouse',button:0,buttons:0,bubbles:true}));
  check(camera.worldContainer.x!==position.x&&camera.worldContainer.y!==position.y&&JSON.stringify(panel.tree)===treeBefore,'Space+dragはCamera pan・コマ不変');
  win.document.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'ShiftLeft',key:'Shift',shiftKey:true,bubbles:true}));const rotation=camera.worldContainer.rotation;renderer.dispatchEvent(new win.WheelEvent('wheel',{deltaY:100,shiftKey:true,bubbles:true,cancelable:true}));check(camera.worldContainer.rotation!==rotation&&JSON.stringify(panel.tree)===treeBefore,'Space+Shift+wheelはCamera回転');
  win.document.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'Space',key:' ',bubbles:true}));win.document.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'ShiftLeft',key:'Shift',bubbles:true}));
  core.eventBus.emit('keyboard:vkey-state-changed',{pressed:true});check(win.getComputedStyle(hit).pointerEvents==='none','global V中はコマoverlayをTransformへ譲る');hit.dispatchEvent(new win.WheelEvent('wheel',{deltaY:100,ctrlKey:true,bubbles:true,cancelable:true}));check(JSON.stringify(panel.tree)===treeBefore,'global V中のCtrlでコマを二重編集しない');core.eventBus.emit('keyboard:vkey-state-changed',{pressed:false});
  q(panel,'[data-output="paper"]').click();const historyBefore=core.history.stack.length,panelAdded=await panel.apply();check(panelAdded.ok&&core.history.stack.length===historyBefore+1,'コマ白/内描画clip/枠を一Historyで追加');panel.hide();const members=()=>core.layerSystem.getLayers().filter(l=>l.layerData.panelLayout?.groupId===panelAdded.groupId);check(members().some(l=>l.layerData.panelLayout.role==='inner'&&l.layerData.clippingMode==='normal'),'内描画clip保持');core.history.undo();check(!members().length,'コマ群追加Undo');core.history.redo();check(members().length>0,'コマ群追加Redo');
  beforePixels=pixels();project=await core.projectManager.exportProject();await core.projectManager.loadProject(realm(project));const afterPixels=pixels();let differences=0;for(let i=0;i<beforePixels.length;i++)if(beforePixels[i]!==afterPixels[i])differences++;check(differences===0&&members().length>0,'斜線/フリー/clipコマProject PNG一致（画素channel差='+differences+'、復元group件数='+members().length+'）');
  const active=members().find(l=>l.layerData.panelLayout.role==='lines');core.layerSystem.setActiveLayer(core.layerSystem.getLayerIndex(active));core.popupManager.show('panelLayout');check(panel.loadFromActiveLayer().ok&&JSON.stringify(panel.tree)===treeBefore,'コマ群から再編集');panel.selectedId=panel.resolved.panels.find(p=>!p.free).id;panel._patchSelectedSplit({ratio:.42});const updatedTree=JSON.stringify(panel.tree),updated=panel.update();check(updated.ok,'コマ群を再編集更新');core.history.undo();check(JSON.stringify(members().find(l=>l.layerData.panelLayout.role==='lines').layerData.panelLayout.tree)===treeBefore,'コマ群更新Undo');core.history.redo();check(JSON.stringify(members().find(l=>l.layerData.panelLayout.role==='lines').layerData.panelLayout.tree)===updatedTree,'コマ群更新Redo');
  for(const height of [640,400]){frame.style.width='360px';frame.style.height=`${height}px`;win.dispatchEvent(new win.Event('resize'));await delay(50);const f=q(panel,'.pl-fixed-footer').getBoundingClientRect();check(f.bottom<=height&&f.right<=360,'コマ360px/高さ'+height+'の確定操作可視');for(const context of ['panel','split','page']){q(panel,`[data-panel-context="${context}"]`).click();check(!q(panel,`[data-panel-pane="${context}"]`).hidden,'コマcontext '+context);}}
  state.textContent='PASS';
 }catch(e){state.textContent='FAIL '+e.message;out.textContent+=e.stack;}
 finally{panel.hide();balloon.hide();balloon._setParams(original);Object.assign(panel,originalPanel);panel._changed();for(const [k,v]of prefs){if(v===null)win.localStorage.removeItem(k);else win.localStorage.setItem(k,v);}}
};
</script></html>
