<!doctype html><html lang="ja"><meta charset="utf-8"><title>WP030 密ウニ・制作動線検証</title>
<style>body{background:#ffffee;color:#800000;font:12px system-ui;margin:6px}iframe{width:1280px;height:720px;border:1px solid #b8706b}pre{white-space:pre-wrap}</style>

<script type="module">

const inspect=()=>{frame.style.width='1280px';frame.style.height='720px';out.hidden=true;win.dispatchEvent(new win.Event('resize'));core.popupManager.hideAll();core.layerSystem.getLayers().forEach((l,i)=>{if(!l.layerData.isBackground&&l.layerData.visible)core.layerSystem.toggleLayerVisibility(i);});core.cameraSystem.setZoom(1);core.popupManager.show('focusLines');f._onAction('reset');q('[data-preset="uni"]').click();f.placeMode=false;f._setParams({...f.params,center:{x:200,y:200},innerRx:115,innerRy:140,color:'#800000'});};
state.textContent='検証可能';document.querySelectorAll('button').forEach(b=>b.disabled=false);document.querySelector('#inspect').onclick=inspect;
document.querySelector('#run').onclick=async()=>{
const original=structuredClone(f.params),prefs=win.localStorage.getItem('tegaki-focus-lines-v1');state.textContent='実行中';out.hidden=false;out.textContent='';document.querySelector('#run').disabled=true;

 q('[data-action="swap-colors"]').click();check(f.params.color==='#abcdef'&&f.params.flash.paperColor==='#123456','二つの色slotを交換');

 q('[data-role="ellipse"]').value='fill';q('[data-role="ellipse"]').dispatchEvent(new win.Event('change',{bubbles:true}));r=f._raster();check(equal(pixel(r,200,200),[18,52,86,255]),'追加楕円は下地色で中心を隠せる');

 const count=f.params.count;q('input[data-field="count"]').dispatchEvent(new win.WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));check(f.params.count===count+1,'基本本数rangeのwheel');
 // Actual SVG painting in document coordinates must match the completion compositor.

 const origin=f.overlay._toScreen({x:0,y:0}),axis=f.overlay._toScreen({x:1,y:0}),scale=Math.hypot(axis.x-origin.x,axis.y-origin.y),svg=f.overlay.svg.cloneNode(true);
 svg.querySelectorAll('.fl-ov-hole,.fl-ov-handle,.fl-ov-place-hit').forEach(el=>el.remove());svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width','400');svg.setAttribute('height','400');svg.setAttribute('viewBox',`${origin.x} ${origin.y} ${400*scale} ${400*scale}`);
 const url=URL.createObjectURL(new Blob([svg.outerHTML],{type:'image/svg+xml'})),img=new Image();img.src=url;await img.decode();const comparison=document.createElement('canvas');comparison.width=400;comparison.height=400;const ctx=comparison.getContext('2d');ctx.drawImage(img,0,0);URL.revokeObjectURL(url);const svgPixels=ctx.getImageData(0,0,400,400).data,now=f._raster();let edgeDifferences=0;
 for(let y=0;y<400;y++)for(let x=0;x<400;x++){const a=pixel(now,x,y),offset=(y*400+x)*4;if(Math.abs(a[3]-svgPixels[offset+3])>12)edgeDifferences++;}
 check(edgeDifferences<400,'実SVGと確定Rasterのalpha形状差は全体の0.25%未満');
 const {rasterizeFocusLines}=await import('../system/focus-lines-raster.js');
 const large=rasterizeFocusLines(f.flash,{width:4960,height:7016,color:f.params.color});check(large.ok&&large.width<400&&large.height<400,'7k原稿でも局所ウニの確保はeffect周囲だけ');
 q('[data-preset="rough"]').click();check(f.params.count===150&&f.params.lengthJitter>.5,'荒ウニも150本の完成形から調整');f.placeMode=false;
 const depthInput=q('input[data-field="flashDepth"]');depthInput.value='2';depthInput.dispatchEvent(new win.Event('input',{bubbles:true}));check(f.params.flash.depth===2&&f.flash.polygons.every(poly=>poly.every(p=>Number.isFinite(p.x)&&Number.isFinite(p.y)))&&f._raster().ok,'深さ200%をUIから出力・有界geometry');
 q('[data-fill="none"]').click();const history=core.history.stack.length,added=f.apply();check(added.ok&&core.history.stack.length===history+1,'密ウニは通常Raster/一History');f.overlay.render();check(!f.draftActive&&!f.overlay.svg.querySelector('.fl-ov-lines'),'確定後draftの二重表示なし');
 q('[data-action="guide"]').click();f.overlay.render();check(f.draftActive&&!f.placeMode&&f.overlay.svg.querySelectorAll('.fl-ov-handle').length===3,'確定後もGuideを戻す1回で編集点を復帰');

 check(f.loadFromActiveLayer().ok,'再編集を再開');core.history.undo();check(!f.draftActive&&layer.layerData.layerSprite.renderable&&f.params.flash.depth===oldDepth,'編集中Undoはdraftを解除し復元recipeへ同期');core.history.redo();check(f.loadFromActiveLayer().ok,'Redo後も再編集できる');f.hide();check(layer.layerData.layerSprite.renderable&&f.previewSource===null,'閉じると元表示を必ず復帰');f.show();
 f._setParams({...f.params,center:{x:-1000,y:-1000},count:4,flash:{...f.params.flash,depth:3}});q('[data-action="guide"]').click();check(f.params.center.x===200&&f.params.count===4,'画面外のGuideは中央へ復帰・表現数値は保持');
 q('[data-action="reset"]').click();f.overlay.render();check(f.params.count===150&&f.params.flash.depth===.45&&!f.placeMode&&f.editing===null&&f.overlay.svg.querySelectorAll('.fl-ov-handle').length===3,'初期化で壊れた数値と配置を標準へ戻す・確定Layer不変');
 const camera=core.cameraSystem,originalScale=camera.worldContainer.scale.x,draft=JSON.stringify(f.params),renderer=win.document.querySelector('.canvas-area canvas');win.document.body.dispatchEvent(new win.KeyboardEvent('keydown',{code:'Space',key:' ',bubbles:true,cancelable:true}));renderer.dispatchEvent(new win.WheelEvent('wheel',{deltaY:-100,bubbles:true,cancelable:true}));win.document.body.dispatchEvent(new win.KeyboardEvent('keyup',{code:'Space',key:' ',bubbles:true,cancelable:true}));check(camera.worldContainer.scale.x!==originalScale&&JSON.stringify(f.params)===draft,'Space wheelはCameraへ・作品値不変');

 state.textContent='PASS';
}catch(e){state.textContent='FAIL '+e.message;out.textContent+=e.stack;}
finally{f.hide();f.editing=null;f._setParams(original);if(prefs===null)win.localStorage.removeItem('tegaki-focus-lines-v1');else win.localStorage.setItem('tegaki-focus-lines-v1',prefs);document.querySelector('#run').disabled=false;}
};
