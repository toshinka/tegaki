<!doctype html><html lang="ja"><meta charset="utf-8"><title>WP030 共通paragraph proof</title>
<button id="run">共通組版を検証</button><span id="state">準備完了</span><pre id="output"></pre>
<script type="module">
import { normalizeLetteringRequest, measureLettering, rasterizeLettering } from '../system/lettering-raster.js';
import { measureParagraph, rasterizeParagraph, paragraphRequest } from '../system/lettering-paragraph.js';
import { fontLibrary } from '../system/font-library.js';
const out=document.querySelector('#output'),state=document.querySelector('#state'),check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
document.querySelector('#run').onclick=async()=>{
 state.textContent='実行中';out.textContent='';try{
 await fontLibrary.init();
 const fonts=[{family:'sans-serif',css:''}];
 const entries=await fontLibrary.listBundledFonts();const primary=entries.find(f=>f.id.includes('gen')&&f.external)||entries.find(f=>f.external);const loaded=await fontLibrary.ensureLoaded(primary.id);check(!!loaded,'外部fontをdecode');fonts.push({family:loaded.family,css:await fontLibrary.getEmbedCss(primary.id)});
 for(const font of fonts)for(const vertical of [false,true])for(const align of ['start','center','end']){
  const params={text:'「セリフ、禁則。」あいうえお\n指定改行 ABC12',fontFamily:font.family,fontSize:22,lineHeight:1.45,tracking:.88,vertical,bold:false,color:'#800000',strokeWidth:2,strokeColor:'#ffffee'};
  const layout={boxWidth:vertical?0:100,boxHeight:vertical?140:0,align,embedCss:font.css};
  const request=normalizeLetteringRequest({text:params.text,fontFamily:params.fontFamily,fontSize:params.fontSize,lineHeight:params.lineHeight,letterSpacing:.04,vertical,color:params.color,outlineWidth:2,outlineColor:params.strokeColor,...layout}).value;
  const oldMeasure=await measureLettering(request),newMeasure=await measureParagraph(params,layout),oldRaster=await rasterizeLettering(request),newRaster=await rasterizeParagraph(params,layout);
  check(newMeasure.ok&&oldMeasure.width===newMeasure.width&&oldMeasure.height===newMeasure.height,'寸法一致 '+font.family+' '+vertical+' '+align);
  check(oldRaster.ok&&newRaster.ok&&oldRaster.width===newRaster.width&&oldRaster.height===newRaster.height&&oldRaster.pixels.every((v,i)=>newRaster.pixels[i]===v),'全画素一致 '+font.family+' '+vertical+' '+align);
  check(params.text.includes('\n')&&newRaster.request.text===params.text,'本文と指定改行を改変しない');
 }
 for(const extra of [{characterStyles:[{start:0,end:1,color:'#ffffff'}]},{outerStrokeWidth:1},{baseline:{kind:'curve'}},{envelope:{kind:'bulge'}},{sizeProfile:{start:1,middle:2,end:1}}])check(!paragraphRequest({text:'あ',...extra}).ok,'未対応属性を明示拒否 '+Object.keys(extra)[0]);
 state.textContent='PASS';
 }catch(e){state.textContent='FAIL '+e.message;out.textContent+=e.stack;}
};
</script></html>
