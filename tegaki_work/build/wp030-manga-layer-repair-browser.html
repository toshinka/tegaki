<!doctype html><html lang="ja"><meta charset="utf-8"><title>WP030 コマ選択・フォルダ移動・縦書き</title>
<style>body{background:#ffffee;color:#800000;font:12px system-ui}iframe{width:1280px;height:720px;border:1px solid #b8706b}pre{white-space:pre-wrap}</style>
<button id="run" disabled>制作操作を検証</button><button id="inspect" disabled>操作見本</button><button id="narrow">360×640</button><button id="wide">1280×720</button><span id="state">起動中</span><pre id="output"></pre><iframe id="product" src="../index.html"></iframe>
<script type="module">
const frame=document.querySelector('#product');
document.querySelector('#narrow').onclick=()=>{frame.style.width='360px';frame.style.height='640px';};
document.querySelector('#wide').onclick=()=>{frame.style.width='1280px';frame.style.height='720px';};
for(let i=0;i<200;i++){if(frame.contentWindow?.pixelSelectionSystem)break;await new Promise(r=>setTimeout(r,100));}
const script=frame.contentDocument.createElement('script');script.type='module';script.src='/build/wp030-manga-layer-repair-proof.mjs';frame.contentDocument.body.append(script);
</script></html>
