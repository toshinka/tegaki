<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WP-005 pointer terminal diagnostic</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 24px; color: #571414; background: #fffaf1; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    #summary { margin: 0 0 16px; font-weight: 700; }
    .case { border: 1px solid #d9a99d; border-radius: 8px; padding: 10px 14px; margin: 8px 0; }
    .case.pass { background: #f3fff2; }
    .case.fail { background: #fff0f0; }
    code { font-family: ui-monospace, monospace; }
  </style>
</head>
<body>
  <h1>WP-005 pointercancel / lostpointercapture diagnostic</h1>
  <p id="summary">RUNNING — production controller / overlay DOM</p>
  <div id="results"></div>
  <script type="module">
    import { LayerTransformWarpController } from '/ui/layer-transform-warp-controller.js';
    import { WarpGridOverlay } from '/ui/warp-grid-overlay.js';

    const clone = points => points.map(point => ({ x: point.x, y: point.y }));
    const equalPoints = (left, right) => JSON.stringify(left) === JSON.stringify(right);
    const results = document.querySelector('#results');
    const summary = document.querySelector('#summary');

    function makePoints() {
      return Array.from({ length: 16 }, (_, index) => ({
        x: (index % 4) / 3,
        y: Math.floor(index / 4) / 3
      }));
    }

    function makeEvent(type, pointerId, clientX, clientY, target) {
      return new PointerEvent(type, {
        bubbles: true,
        cancelable: true,
        pointerId,
        pointerType: 'mouse',
        isPrimary: true,
        button: 0,
        buttons: type === 'pointerup' || type === 'pointercancel' ? 0 : 1,
        clientX,
        clientY
      });
    }

    async function settleOverlay() {
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }

    async function runCase(label, target) {
      const baseline = makePoints();
      let points = clone(baseline);
      let finishCalls = 0;
      let historyCommands = 0;
      const layerSystem = {
        isLayerMoveMode: true,
        beginLayerWarpEditSession() {
          return {
            ok: true,
            bindBounds: { x: 0, y: 0, width: 100, height: 100 },
            points: clone(points),
            transaction: { target }
          };
        },
        getLayerWarpEditSession() {
          return {
            bindBounds: { x: 0, y: 0, width: 100, height: 100 },
            points: clone(points),
            transaction: { target }
          };
        },
        previewLayerWarpEditSession(nextPoints) {
          points = clone(nextPoints);
          return { ok: true, changed: true };
        },
        finishLayerWarpEditSession() {
          finishCalls += 1;
          return { ok: true, commit: false };
        },
        recordHistory() {
          historyCommands += 1;
        }
      };
      const coordinateSystem = {
        screenClientToWorld(clientX, clientY) {
          return { worldX: clientX, worldY: clientY };
        },
        worldToScreenImmediate(x, y) {
          return { clientX: x, clientY: y };
        }
      };
      const overlay = new WarpGridOverlay();
      const controller = new LayerTransformWarpController({ layerSystem, coordinateSystem, overlay });
      if (controller.begin() !== true) throw new Error('controller.begin() rejected');
      await settleOverlay();
      const hit = () => document.querySelectorAll('.warp-grid-overlay-point-hit')[5];
      if (!hit()) throw new Error('production overlay hit target missing');

      hit().dispatchEvent(makeEvent('pointerdown', 1, 33, 33, hit()));
      hit().dispatchEvent(makeEvent('pointermove', 1, 70, 80, hit()));
      const stateA = clone(points);
      hit().dispatchEvent(makeEvent('pointerup', 1, 70, 80, hit()));
      if (!equalPoints(points, stateA)) throw new Error('pointerup did not retain Gesture A');

      hit().dispatchEvent(makeEvent('pointerdown', 2, 70, 80, hit()));
      hit().dispatchEvent(makeEvent('pointermove', 2, 85, 95, hit()));
      hit().dispatchEvent(makeEvent('pointercancel', 2, 85, 95, hit()));
      if (!equalPoints(points, stateA)) throw new Error('pointercancel did not rollback Gesture B');
      if (!controller.modeActive || !layerSystem.getLayerWarpEditSession()) {
        throw new Error('pointercancel ended the WARP session');
      }

      hit().dispatchEvent(makeEvent('pointerdown', 3, 70, 80, hit()));
      hit().dispatchEvent(makeEvent('pointermove', 3, 25, 30, hit()));
      hit().dispatchEvent(makeEvent('lostpointercapture', 3, 25, 30, hit()));
      if (!equalPoints(points, stateA)) throw new Error('lostpointercapture did not rollback the gesture');

      hit().dispatchEvent(makeEvent('pointerdown', 4, 70, 80, hit()));
      hit().dispatchEvent(makeEvent('pointermove', 4, 60, 65, hit()));
      const stateD = clone(points);
      hit().dispatchEvent(makeEvent('pointerup', 4, 60, 65, hit()));
      hit().dispatchEvent(makeEvent('lostpointercapture', 4, 60, 65, hit()));
      if (!equalPoints(points, stateD)) throw new Error('late lostpointercapture rolled back pointerup');
      if (finishCalls !== 0 || historyCommands !== 0) {
        throw new Error('gesture terminal mutated History/session');
      }
      controller.deactivate();
      return { label, status: 'PASS', details: 'A retained; B pointercancel rolled back; capture-loss rolled back; late loss retained pointerup' };
    }

    const cases = [
      ['NORMAL SOURCE', 'layer-source'],
      ['CAF ANIMATE', 'clip-layer-transform-key']
    ];
    const outcomes = [];
    for (const [label, target] of cases) {
      const row = document.createElement('div');
      row.className = 'case';
      try {
        const result = await runCase(label, target);
        row.classList.add('pass');
        row.textContent = `${result.label}: ${result.status} — ${result.details}`;
        outcomes.push(true);
      } catch (error) {
        row.classList.add('fail');
        row.textContent = `${label}: FAIL — ${error?.message || error}`;
        outcomes.push(false);
      }
      results.appendChild(row);
    }
    const pass = outcomes.every(Boolean);
    summary.textContent = pass
      ? 'PASS — production DOM listeners received synthetic PointerEvent terminals'
      : 'FAIL — pointer terminal diagnostic failed';
    summary.dataset.trustedDevice = 'not-verified';
    summary.dataset.syntheticDom = pass ? 'pass' : 'fail';
  </script>
</body>
</html>
