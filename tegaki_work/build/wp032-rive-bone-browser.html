<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WP032 Rive End骨 直接編集 Browser fixture</title>
  <style>
    :root { color-scheme: light; font: 13px/1.45 system-ui, sans-serif; }
    body { margin: 12px; color: #800000; background: #ffffee; }
    button { margin-right: 6px; padding: 6px 9px; color: #800000; background: #f0e0d6; border: 1px solid #9c3835; border-radius: 4px; }
    button:disabled { opacity: .55; }
    iframe { display: block; width: min(1280px, calc(100vw - 24px)); height: min(820px, calc(100vh - 170px)); min-height: 520px; margin-top: 10px; border: 1px solid #b8706b; background: #ffffee; }
    #status { display: inline-block; margin-left: 6px; }
    #output { max-width: 1280px; min-height: 100px; white-space: pre-wrap; background: #f0e0d6; padding: 8px; }
    .instructions { max-width: 1280px; padding: 8px; border: 1px solid #d4a8a0; }
  </style>
</head>
<body>
  <h1>WP032 — Rive End骨を画面上で直接編集</h1>
  <div class="instructions">
    <strong>trusted操作:</strong> 「元絵を用意」→「新RIG入口を開く」。編集面で native 表示を確認し、<code>rive-bone-end</code> を mouse/touch/pen でドラッグ、または focus 後に矢印1°/Shift5°、Enterで確定、Escapeで取消します。preview中の補助線はPNG/native frameへ入りません。
  </div>
  <p>
    <button id="prepare" data-testid="wp032-prepare" disabled>元絵を用意</button>
    <button id="open" data-testid="wp032-open" disabled>新RIG入口を開く</button>
    <button id="inspect" data-testid="wp032-inspect" disabled>host状態を確認</button>
    <span id="status" role="status">製品起動待ち</span>
  </p>
  <pre id="output" data-testid="wp032-output"></pre>
  <iframe id="product" title="WP032 product fixture" src="../index.html"></iframe>
  <script type="module">
    // ROLE: Visible WP032 Browser fixture. It prepares a real product Raster and exposes the ordinary host entry.
    // TRUST: This page never dispatches pointer/keyboard events to the bone handle; those steps are trusted user actions.
    const frame = document.querySelector('#product');
    const prepare = document.querySelector('#prepare');
    const open = document.querySelector('#open');
    const inspect = document.querySelector('#inspect');
    const status = document.querySelector('#status');
    const output = document.querySelector('#output');
    let core = null;
    let baseline = null;
    const log = value => { output.textContent += `${value}\n`; };
    const check = (condition, message) => { if (!condition) throw new Error(message); log(`PASS ${message}`); };
    const pixels = () => core.exportManager.renderToCanvas({ transparent: true }).getContext('2d').getImageData(0, 0, core.layerSystem.config.canvas.width, core.layerSystem.config.canvas.height).data;
    async function waitForProduct() {
      for (let index = 0; index < 240; index += 1) {
        core = frame.contentWindow?.coreEngine;
        if (core?.layerSystem?.currentFrameContainer && frame.contentDocument.querySelector('[data-testid="rive-editor-entry"]')) break;
        await new Promise(resolve => setTimeout(resolve, 100));
      }
      if (!core?.layerSystem?.currentFrameContainer) { status.textContent = 'FAIL 製品が起動しません'; return; }
      prepare.disabled = false; status.textContent = '元絵を用意してから入口を開いてください';
    }
    prepare.addEventListener('click', () => {
      prepare.disabled = true;
      try {
        const layerSystem = core.layerSystem;
        const pixelsForMarker = new frame.contentWindow.Uint8ClampedArray(4 * 4 * 4);
        for (let index = 0; index < 16; index += 1) pixelsForMarker.set([30 + index * 10, 70, 120, 255], index * 4);
        const made = layerSystem.createRasterLayerFromSnapshot({ width: 4, height: 4, pixels: pixelsForMarker, rasterBounds: { x: 3, y: 5, width: 4, height: 4 }, paths: [], pathsData: [] }, { name: 'WP032元絵', historyName: 'wp032-fixture' });
        check(!!made?.layer, '独立元絵Rasterを用意');
        baseline = { ids: layerSystem.getLayers().map(layer => layer.layerData.id), history: core.history.stack.length, composite: pixels().slice() };
        open.disabled = false;
        inspect.disabled = false;
        status.textContent = '新RIG入口を開き、trusted操作でEnd骨を編集してください';
      } catch (error) { status.textContent = `FAIL ${error.message}`; log(error.stack || error.message); prepare.disabled = false; }
    });
    open.addEventListener('click', () => {
      const entry = frame.contentDocument.querySelector('[data-testid="rive-editor-entry"]');
      if (!entry) { status.textContent = 'FAIL 新RIG入口がありません'; return; }
      entry.click();
      status.textContent = '編集面を操作中。native表示・End骨・preview/取消/Enter/保存を確認してください';
      log('入口を通常product経路で開いた。pointer/keyboardはtrusted操作で実施する。');
    });
    inspect.addEventListener('click', () => {
      try {
        const host = frame.contentDocument.querySelector('[data-testid="rive-host-state"]');
        check(!!host, 'host snapshotが表示されている');
        const value = JSON.parse(host.textContent || '{}');
        log(`HOST ${JSON.stringify(value)}`);
        check(value.connection?.phase === 'connected' || value.state?.status, 'hostがeditor接続状態を受け取った');
        if (baseline) check(core.layerSystem.getLayers().filter(layer => !baseline.ids.includes(layer.layerData.id)).length === 0, '明示フレーム追加前は通常Layerを増やしていない');
        status.textContent = 'host状態を記録しました。編集面のtrusted操作結果を目視・snapshotで確認してください';
      } catch (error) { status.textContent = `FAIL ${error.message}`; log(error.stack || error.message); }
    });
    void waitForProduct();
  </script>
</body>
</html>
