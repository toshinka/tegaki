<!doctype html><html lang="ja"><meta charset="utf-8"><title>WP030 共通書体窓</title>
<style>body{background:#ffffee;color:#800000;font:12px system-ui}iframe{width:1280px;height:720px;border:1px solid #b8706b}pre{white-space:pre-wrap}</style>
<button id="run" disabled>管理操作を検証</button><span id="state">製品起動中</span><pre id="output"></pre><iframe id="product" src="../index.html"></iframe>
<script type="module">
// Product entry moved into information/organization; retain the old fixture URL.
location.replace('./wp030-font-information-browser.html');
await new Promise(() => {});
const frame=document.querySelector('#product'),out=document.querySelector('#output'),state=document.querySelector('#state');
const delay=ms=>new Promise(r=>setTimeout(r,ms)),check=(ok,label)=>{if(!ok)throw Error(label);out.textContent+='PASS '+label+'\n';};
let core;for(let i=0;i<200;i++){core=frame.contentWindow?.coreEngine;if(core?.fontLibraryWindow&&core?.popupManager?.get('lettering')?.isReady())break;await delay(100);}
const win=frame.contentWindow,manager=core.fontLibraryWindow,library=manager.library;
const changed=async()=>{await manager.refresh();await delay(30);};
const set=(el,value)=>{el.value=value;el.dispatchEvent(new win.Event('change',{bubbles:true}));};
state.textContent='検証可能';document.querySelector('#run').disabled=false;
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;out.textContent='';state.textContent='実行中';
 const originalPrefs=library.getPreferences(),originalOrg=library.getOrganization();let folderId,importedId;
 try{
  const lettering=core.popupManager.get('lettering'),balloon=core.popupManager.get('balloon');
  const before=JSON.stringify(lettering.params),beforeBalloon=JSON.stringify(balloon.params),historyCount=core.history.stack.length;
  manager.button.click();await changed();check(manager.comparison.isOpen()&&manager.rows.length>=27,'右下からEの27書体を表示');
  manager.comparison._commit(manager.rows[2]);manager.comparison._preview(manager.rows[3].key);
  check(JSON.stringify(lettering.params)===before&&JSON.stringify(balloon.params)===beforeBalloon,'見本選択・hoverで作品不変');
  manager.comparison.setMode('information');check(!manager.comparison.refs.information.hidden&&manager.comparison.refs.cards.hidden,'管理tabへ即時切替');
  manager.refs['folder-name'].value='WP030 検証用';await manager._action('add-folder');folderId=manager.folderId;
  check(library.getOrganization().folders.some(f=>f.id===folderId),'分類folder作成');
  manager.refs['folder-name'].value='WP030 改名';await manager._action('rename-folder');
  check(library.getOrganization().folders.find(f=>f.id===folderId).label==='WP030 改名','分類folder改名');
  const selected=manager.selectedId,originalPlacement=library.getOrganization().placements[selected];
  set(manager.refs.storage,folderId);await changed();check(library.getOrganization().placements[selected]===folderId,'書体の収納先変更');
  for(let i=0;i<30&&(lettering._fontData.organization.placements[selected]!==folderId||balloon._fontData.organization.placements[selected]!==folderId);i++)await delay(20);
  check(lettering._fontData.organization.placements[selected]===folderId&&balloon._fontData.organization.placements[selected]===folderId,'文字・吹き出しの分類表示へ同期');
  manager.refs.favorite.checked=!originalPrefs.favorites.includes(selected);manager.refs.favorite.dispatchEvent(new win.Event('change',{bubbles:true}));
  manager.refs.note.value='短評の検証';manager.refs.note.dispatchEvent(new win.Event('input',{bubbles:true}));await changed();
  check(library.getPreferences().comments[selected]==='短評の検証'&&manager.refs.favorite.checked!==originalPrefs.favorites.includes(selected),'favoriteと短評を既存設定へ保存');
  await manager._action('primary');await changed();check(library.getPreferences().primaryId===selected,'Primaryを既存設定へ保存');
  const second=manager.rows.find(row=>row.id!==selected);library.setFontFolder(second.id,folderId);await changed();
  const orderKey=`folder:${folderId}`;await manager._action('down');
  check(library.getOrganization().orders[orderKey].at(-1)===`font:${selected}`,'同じfolder内で下へ');await manager._action('up');
  check(library.getOrganization().orders[orderKey][0]===`font:${selected}`,'同じfolder内で上へ');
  const source=manager.rows.find(row=>row.bundled),loaded=await library.ensureLoaded(source.id);
  const transfer=new win.DataTransfer();transfer.items.add(new win.File([loaded.data],'WP030-import-test.ttf',{type:'font/ttf'}));
  manager.refs.files.files=transfer.files;await manager._importFiles();importedId=manager.selectedId;
  check(importedId!==source.id&&manager.rows.some(row=>row.id===importedId&&!row.bundled)&&library.getOrganization().placements[importedId]===folderId,'実font bytesを既存importへ取り込み、収納先反映');
  manager.comparison._commit(manager.rows.find(row=>row.id===selected));
  manager.folderId=folderId;await manager._action('delete-folder');folderId=null;
  check(library.getOrganization().placements[selected]===null&&manager.rows.some(r=>r.id===selected),'folder解除後も書体保持');
  library.setFontFolder(selected,originalPlacement);await changed();
  check(JSON.stringify(lettering.params)===before&&JSON.stringify(balloon.params)===beforeBalloon&&core.history.stack.length===historyCount,'管理変更でも作品・History不変');
  const status=manager.button.closest('.status-panel'),originalParent=status.parentElement,originalNext=status.nextSibling;
  const dock=win.document.createElement('div');dock.className='anim-dock-status-test';originalParent.append(dock);dock.append(status);
  check(dock.contains(manager.button),'同じstatus nodeのdock移動に入口追従');originalParent.insertBefore(status,originalNext);dock.remove();
  const bounds=manager.container.getBoundingClientRect();check(bounds.left>=0&&bounds.right<=1280&&bounds.top>=0&&bounds.bottom<=720,'1280画面内に収まる');
  manager.comparison.refs.close.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',isComposing:true,bubbles:true,cancelable:true}));
  check(manager.comparison.isOpen(),'IME変換中のEscapeは窓を閉じない');
  manager.comparison.refs.close.dispatchEvent(new win.KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));
  check(!manager.comparison.isOpen()&&win.document.activeElement===manager.button,'Escapeで閉じて入口へfocus復帰');
  library.setPreferences(originalPrefs);await manager.toggle(true);await changed();
  check(manager.refs.note.value===(originalPrefs.comments[manager.selectedId]||''),'再openで最新設定を反映');
  frame.style.width='360px';frame.style.height='640px';await delay(100);manager.comparison.reposition();
  const small=manager.container.getBoundingClientRect();check(small.left>=0&&small.right<=360&&small.bottom<=640,'360画面内に収まる');
  check(manager.comparison.refs.information.scrollWidth<=manager.comparison.refs.information.clientWidth+1,'管理内容の横overflowなし');
  state.textContent='PASS';
 }catch(e){state.textContent='FAIL '+e.message;out.textContent+=e.stack;throw e;}
 finally{
  if(importedId)await library.deleteFont(importedId);
  if(folderId)library.deleteOrganizationFolder(folderId);
  for(const [parentKey,nodes] of Object.entries(originalOrg.orders||{})){
   const parent=parentKey==='root'?null:parentKey.slice(7);let before=null;
   for(const node of [...nodes].reverse()){library.moveOrganizationNode(node,parent,before);before=node;}
  }
  library.setPreferences(originalPrefs);await changed();document.querySelector('#run').disabled=false;
 }
};
</script></html>
